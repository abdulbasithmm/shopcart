<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b5c37" />
      <stop offset="50%" stop-color="#074728" />
      <stop offset="100%" stop-color="#042c18" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />

  <!-- Subtle Inner Border Highlight -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4" />

  <!-- Shopping Cart & Bag Silhouette -->
  <g filter="url(#shadow)" transform="translate(4, -8)">
    <!-- Cart Basket Outline -->
    <path d="M120 148h48l44 168c4 14 16 24 31 24h175c14 0 26-9 30-22l40-128c3-9-3-18-12-18H206" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="26" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Shopping Bag Inside Cart -->
    <path d="M260 170v-30c0-22 18-40 40-40s40 18 40 40v30" 
          fill="none" 
          stroke="url(#accentGrad)" 
          stroke-width="18" 
          stroke-linecap="round" />
    
    <rect x="236" y="170" width="128" height="110" rx="18" fill="url(#cartGrad)" />
    
    <!-- Bag Ribbon / Star Sparkle -->
    <circle cx="300" cy="225" r="14" fill="#ffffff" fill-opacity="0.95" />
    <polygon points="300,205 304,221 320,225 304,229 300,245 296,229 280,225 296,221" fill="url(#accentGrad)" />

    <!-- Cart Wheels -->
    <circle cx="236" cy="386" r="28" fill="#ffffff" />
    <circle cx="236" cy="386" r="12" fill="#0b5c37" />
    
    <circle cx="396" cy="386" r="28" fill="#ffffff" />
    <circle cx="396" cy="386" r="12" fill="#0b5c37" />
  </g>
</svg>
