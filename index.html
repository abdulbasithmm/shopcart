    <script>
      // Gracefully intercept Vite dev HMR WebSocket in cloud preview/iframe environments
      (function() {
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OriginalWS = window.WebSocket;
          var PatchedWS = function(url, protocols) {
            var urlStr = String(url || '');
            var isHmr = urlStr.indexOf('24678') !== -1 ||
                        urlStr.indexOf('token=') !== -1 ||
                        urlStr.indexOf('@vite-hmr') !== -1 ||
                        (typeof protocols === 'string' && protocols.indexOf('vite-hmr') !== -1) ||
                        (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1);
            if (isHmr) {
              var listeners = { open: [], message: [], close: [], error: [] };
              var fake = {
                readyState: 1,
                OPEN: 1,
                CONNECTING: 0,
                CLOSING: 2,
                CLOSED: 3,
                url: urlStr,
                protocol: 'vite-hmr',
                bufferedAmount: 0,
                extensions: '',
                binaryType: 'blob',
                addEventListener: function(event, handler) {
                  if (listeners[event]) listeners[event].push(handler);
                  if (event === 'open') {
                    setTimeout(function() {
                      try { handler(new Event('open')); } catch (e) {}
                    }, 0);
                  }
                },
                removeEventListener: function(event, handler) {
                  if (listeners[event]) {
                    listeners[event] = listeners[event].filter(function(h) { return h !== handler; });
                  }
                },
                dispatchEvent: function() { return true; },
                send: function() {},
                close: function() { fake.readyState = 3; }
              };
              ['open', 'message', 'error', 'close'].forEach(function(evt) {
                Object.defineProperty(fake, 'on' + evt, {
                  get: function() { return null; },
                  set: function(handler) {
                    if (handler) fake.addEventListener(evt, handler);
                  }
                });
              });
              return fake;
            }
            return new OriginalWS(url, protocols);
          };
          PatchedWS.prototype = OriginalWS.prototype;
          PatchedWS.CONNECTING = OriginalWS.CONNECTING;
          PatchedWS.OPEN = OriginalWS.OPEN;
          PatchedWS.CLOSING = OriginalWS.CLOSING;
          PatchedWS.CLOSED = OriginalWS.CLOSED;
          window.WebSocket = PatchedWS;
        }
      })();
    </script>

    <script>
      (function() {
        try {
          var hash = window.location.hash || '';
          var path = window.location.pathname || '/';
          // Immediately normalize /?utm_source=chatgpt.com#/admin/login and #/admin/login to clean /admin/login
          if (hash.indexOf('admin/login') !== -1 || hash.indexOf('admin-login') !== -1) {
            window.history.replaceState(null, '', '/admin/login');
          } else if (hash.indexOf('admin/dashboard') !== -1 || hash === '#admin' || hash === '#/admin') {
            window.history.replaceState(null, '', '/admin/dashboard');
          } else if (hash.indexOf('admin/') !== -1) {
            var match = hash.match(/admin\/([a-z-]+)/i);
            if (match && match[1]) {
              window.history.replaceState(null, '', '/admin/' + match[1]);
            }
          } else if (path.indexOf('/admin') === 0 && hash) {
            window.history.replaceState(null, '', path);
          }
        } catch (e) {}

        // Ignore Vite HMR WebSocket connection errors in sandbox/proxy environments
        window.addEventListener('error', function(event) {
          var msg = (event && event.message) ? String(event.message) : '';
          var file = (event && event.filename) ? String(event.filename) : '';
          if (
            msg.indexOf('WebSocket closed without opened') !== -1 ||
            (msg.indexOf('WebSocket') !== -1 && file.indexOf('@vite/client') !== -1)
          ) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
            return true;
          }
        }, true);
        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = reason && typeof reason.message === 'string' ? reason.message : '';
          if (msg.indexOf('WebSocket closed without opened') !== -1) {
            if (event.preventDefault) event.preventDefault();
            if (event.stopImmediatePropagation) event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
